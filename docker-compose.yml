networks:
  default:
  dokploy-network:
    external: true

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      INVOICE_PASSWORD_HAKEEMI: ${INVOICE_PASSWORD_HAKEEMI:?set INVOICE_PASSWORD_HAKEEMI}
      INVOICE_PASSWORD_EZZY: ${INVOICE_PASSWORD_EZZY:?set INVOICE_PASSWORD_EZZY}
      HAKEEMI_BUSINESS_NAME: ${HAKEEMI_BUSINESS_NAME:-}
      HAKEEMI_EMAIL: ${HAKEEMI_EMAIL:-}
      HAKEEMI_PHONE: ${HAKEEMI_PHONE:-}
      HAKEEMI_BANK_NAME: ${HAKEEMI_BANK_NAME:-}
      HAKEEMI_BANK_ACCOUNT: ${HAKEEMI_BANK_ACCOUNT:-}
      HAKEEMI_BANK_HOLDER: ${HAKEEMI_BANK_HOLDER:-}
      EZZY_BUSINESS_NAME: ${EZZY_BUSINESS_NAME:-}
      EZZY_EMAIL: ${EZZY_EMAIL:-}
      EZZY_PHONE: ${EZZY_PHONE:-}
      EZZY_PAYMENT_INFO: ${EZZY_PAYMENT_INFO:-}
    expose:
      - "3000"
    networks:
      - default
      - dokploy-network
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_REGION: ${SPACES_REGION:-}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-}
      SPACES_CDN_URL: ${SPACES_CDN_URL:-}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keemi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: keemi_portfolio
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keemi -d keemi_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
